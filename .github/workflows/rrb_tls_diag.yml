name: RRB TLS Diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tls:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Write probe script
        run: |
          mkdir -p tls_diag
          cat > tls_diag/probe.py <<'PYEOF'
          import json, os, socket, ssl, sys, time
          PORT = int(os.environ.get("PROBE_PORT", "443")); T = 10.0
          def err(e): return f"{type(e).__name__}: {' '.join(str(e).split())[:160]}"
          def resolve(host, fam):
              try: return list(dict.fromkeys(i[4][0] for i in socket.getaddrinfo(host, PORT, fam, socket.SOCK_STREAM)))
              except Exception as e: return err(e)
          def tls_probe(host, ip, fam, name, maxver=None, mss=None):
              r = {"variant": name, "ip": ip, "sent": 0, "recvd": 0}; t0 = time.monotonic(); s = socket.socket(fam, socket.SOCK_STREAM); s.settimeout(T); ok = False
              try:
                  if mss: s.setsockopt(socket.IPPROTO_TCP, socket.TCP_MAXSEG, mss)
                  s.connect((ip, PORT)); r["tcp_s"] = round(time.monotonic() - t0, 2); t1 = time.monotonic()
                  ctx = ssl.create_default_context()
                  if maxver: ctx.maximum_version = maxver
                  inb, outb = ssl.MemoryBIO(), ssl.MemoryBIO(); o = ctx.wrap_bio(inb, outb, server_hostname=host)
                  while True:
                      try: o.do_handshake(); done = True
                      except ssl.SSLWantReadError: done = False
                      data = outb.read()
                      if data:
                          s.sendall(data); r["sent"] += len(data); r.setdefault("client_hello_bytes", len(data))
                      if done: ok = True; break
                      chunk = s.recv(16384)
                      if not chunk: r["outcome"] = "peer_closed_connection_(FIN)_during_handshake"; break
                      if "first_server_byte" not in r: r["first_server_byte"] = hex(chunk[0])  # 0x16=handshake record, 0x15=alert
                      r["recvd"] += len(chunk); inb.write(chunk)
                  if ok:
                      r["handshake_s"] = round(time.monotonic() - t1, 2); r["tls"], r["cipher"] = o.version(), o.cipher()[0]
                      o.write(f"HEAD / HTTP/1.1\r\nHost: {host}\r\nConnection: close\r\n\r\n".encode()); s.sendall(outb.read()); buf = b""
                      while b"\r\n" not in buf:
                          try: buf += o.read(200)
                          except ssl.SSLWantReadError:
                              chunk = s.recv(16384)
                              if not chunk: break
                              inb.write(chunk)
                          except ssl.SSLError: break
                      r["outcome"] = "https_ok"; r["status_line"] = buf.split(b"\r\n")[0].decode("latin1")
              except socket.timeout:
                  r["outcome"] = "TIMEOUT_no_bytes_from_server_after_ClientHello" if r["recvd"] == 0 and "tcp_s" in r else "TIMEOUT_after_partial_server_data" if r["recvd"] else "TIMEOUT_during_tcp_connect"
              except ConnectionResetError as e: r["outcome"] = "RESET_by_peer_or_path"; r["error"] = err(e)
              except ssl.SSLCertVerificationError as e: r["outcome"] = "certificate_verification_failed"; r["error"] = err(e)
              except Exception as e: r["outcome"] = "other_error"; r["error"] = err(e)
              finally: s.close()
              r["total_s"] = round(time.monotonic() - t0, 2); return r
          def plain_probe(host, ip, fam, port, name):
              r = {"variant": name, "ip": ip}; s = socket.socket(fam, socket.SOCK_STREAM); s.settimeout(T)
              try:
                  s.connect((ip, port)); s.sendall(f"GET / HTTP/1.1\r\nHost: {host}\r\nConnection: close\r\n\r\n".encode()); d = s.recv(300)
                  r["outcome"] = "bytes_received" if d else "closed_without_data"; r["first_bytes"] = d[:100].decode("latin1")
              except socket.timeout: r["outcome"] = "TIMEOUT_no_response"
              except Exception as e: r["outcome"] = "error"; r["error"] = err(e)
              finally: s.close()
              return r
          for host in sys.argv[1:]:
              rec = {"host": host, "ipv4": resolve(host, socket.AF_INET), "ipv6": resolve(host, socket.AF_INET6), "probes": []}
              v4 = rec["ipv4"][0] if isinstance(rec["ipv4"], list) and rec["ipv4"] else None
              v6 = rec["ipv6"][0] if isinstance(rec["ipv6"], list) and rec["ipv6"] else None
              if v4:
                  rec["probes"] += [tls_probe(host, v4, socket.AF_INET, "ipv4_default_tls"), tls_probe(host, v4, socket.AF_INET, "ipv4_tls1.2_max", maxver=ssl.TLSVersion.TLSv1_2),
                                    tls_probe(host, v4, socket.AF_INET, "ipv4_mss536_(small_packets)", mss=536), plain_probe(host, v4, socket.AF_INET, PORT, "ipv4_plain_http_sent_to_443")]
                  if PORT == 443: rec["probes"].append(plain_probe(host, v4, socket.AF_INET, 80, "ipv4_plain_http_port80"))
              if v6: rec["probes"].append(tls_probe(host, v6, socket.AF_INET6, "ipv6_default_tls"))
              print(json.dumps(rec, indent=1), flush=True)
          PYEOF
      - name: Runner info
        run: |
          { echo "runner_public_ip: $(curl -s -m 10 https://api.ipify.org || echo unavailable)"; openssl version; python3 --version
            ip -o link | sed -E 's/^[0-9]+: ([^:]+):.*mtu ([0-9]+).*/\1 mtu \2/'; } 2>&1 | tee tls_diag/runner.txt
      - name: RRB - packet capture + Python probes + OpenSSL variants (verification ON)
        run: |
          H=rrb.indianrailways.gov.in
          IP=$(getent ahostsv4 "$H" | awk 'NR==1{print $1}'); echo "rrb_ipv4: $IP" | tee tls_diag/rrb_ip.txt
          command -v tcpdump >/dev/null || sudo apt-get install -y -qq tcpdump >/dev/null 2>&1
          sudo tcpdump -i any -nn -s 200 -w tls_diag/rrb.pcap "host $IP or icmp" >/dev/null 2>&1 &
          TCPD=$!; sleep 2
          python3 tls_diag/probe.py "$H" 2>&1 | tee tls_diag/python_probes_rrb.json
          run() { echo "=== openssl s_client $*"; timeout 20 openssl s_client -connect "$IP:443" -msg -verify_return_error -verify_hostname "$H" "$@" </dev/null 2>&1 | head -40; echo "exit=${PIPESTATUS[0]}"; }
          { run -servername "$H"; run -servername "$H" -tls1_2; run -servername "$H" -tls1_3; run; } 2>&1 | tee tls_diag/openssl_rrb.txt
          sleep 1; sudo kill -INT $TCPD || true; sleep 2; sudo chmod a+r tls_diag/rrb.pcap || true
          { sudo tcpdump -nn -tt -r tls_diag/rrb.pcap 2>&1 | head -80; } | tee tls_diag/rrb_tcpdump.txt || true
      - name: Controls (same probe code)
        if: always()
        run: python3 tls_diag/probe.py indianrailways.gov.in www.india.gov.in www.google.com 2>&1 | tee tls_diag/python_probes_controls.json
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rrb_tls_diagnostic
          path: tls_diag/
          if-no-files-found: warn
