name: RRB Live Test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest
      - name: Offline regression tests
        run: python -m pytest -q test_rrb.py
      - name: Live run (exit 2 = TOTAL_FAILURE, expected if blocked)
        run: python rrb.py --out rrb_report.json
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rrb_report
          path: rrb_report.json
          if-no-files-found: warn
