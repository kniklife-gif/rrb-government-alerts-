name: rrb-diagnose
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests beautifulsoup4 lxml
      - id: diag
        continue-on-error: true
        run: |
          rc=0; python3 rrb.py --diagnose > diag.json || rc=$?
          cat diag.json; echo "diagnose_exit=$rc"; exit $rc
      - if: steps.diag.outcome == 'success'
        run: python3 rrb.py --live --pdf-meta --output rrb_live.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rrb-results
          path: |
            diag.json
            rrb_live.json
          if-no-files-found: ignore
